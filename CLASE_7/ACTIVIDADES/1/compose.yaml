services:
  api1:
    build: .
    environment:
      NOMBRE_SERVIDOR: "Clima A"
    ports:
      - "3001:3000"

  api2:
    build: .
    ports:
      - "3002:3000"

  balanceador:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
