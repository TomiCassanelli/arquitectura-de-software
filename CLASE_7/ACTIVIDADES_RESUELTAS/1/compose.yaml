services:
  api1:
    build: .
    environment:
      NOMBRE_SERVIDOR: "Clima A"
    expose:
      - "3000"

  api2:
    build: .
    environment:
      NOMBRE_SERVIDOR: "Clima B"
    expose:
      - "3000"

  api3:
    build: .
    environment:
      NOMBRE_SERVIDOR: "Clima C"
    expose:
      - "3000"

  balanceador:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
