events {}

http {
    # El grupo contiene las tres réplicas. Sin declarar otro algoritmo, NGINX
    # las utiliza con round robin.
    upstream api_clima {
        server api1:3000;
        server api2:3000;
        server api3:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_clima;
        }
    }
}
