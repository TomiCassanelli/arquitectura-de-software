events {}

http {
    # Este grupo contiene las tres copias de nuestra API.
    upstream backends {
        server api1:3000;
        server api2:3000;
        server api3:3000;
    }

    server {
        # NGINX recibe las peticiones de los clientes por el puerto 80.
        listen 80;

        location / {
            # NGINX elige un servidor del grupo. Por defecto usa round robin:
            # A, luego B, luego C, y vuelve a empezar.
            proxy_pass http://backends;
        }
    }
}
