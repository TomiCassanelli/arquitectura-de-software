# Una sola orden, `docker compose up --build`, inicia toda la presentación.
# Un nombre propio evita mezclar estos contenedores con CLASE_7/DEMO.
name: clase8-observabilidad

services:
  app:
    # El Dockerfile compila main.go y crea la imagen de la API.
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # La app usa este usuario para insertar eventos en la tabla app_logs.
      MYSQL_DSN: demo:demo@tcp(mysql:3306)/observabilidad?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    # Prometheus consulta /metrics de la app cada cinco segundos.
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  mysql:
    # Cada log de la app se guarda como una fila en MySQL.
    image: mysql:8.4
    environment:
      # Credenciales simples exclusivamente para esta demo local.
      MYSQL_ROOT_PASSWORD: root_demo
      MYSQL_DATABASE: observabilidad
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    volumes:
      - mysql_data:/var/lib/mysql
      # El SQL crea la tabla y un usuario que solo puede leer para Grafana.
      - ./mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      # El servicio está listo cuando el usuario puede consultar la tabla.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u demo -pdemo observabilidad -e 'SELECT 1 FROM app_logs LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  grafana:
    # Grafana es la interfaz web; los datasources y el dashboard se cargan solos.
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Grafana usa el usuario de solo lectura creado en 001_schema.sql.
      GRAFANA_MYSQL_PASSWORD: grafana_demo
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      mysql:
        condition: service_healthy

# Los volúmenes conservan los datos al reiniciar los contenedores.
volumes:
  prometheus_data:
  mysql_data:
  grafana_data:
